name: 대차잔고 업데이트

on:
  schedule:
    # 대차 자료는 다음 영업일 13시 이후에 올라와요. 저녁에 받아서 전날 자료를 채워요.
    # GitHub 예약 실행은 늦어지거나 건너뛸 때가 있어서 예비 시각을 두 번 더 넣었어요. (시각은 UTC 기준)
    - cron: "20 11 * * 1-5"   # 한국시간 20:20
    - cron: "29 13 * * 1-5"   # 한국시간 22:29 (예비)
    - cron: "35 21 * * 1-5"   # 한국시간 다음 날 06:35 (예비)
  workflow_dispatch: {}        # Actions 탭에서 손으로 실행할 수 있게

jobs:
  lending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install requests

      - name: 대차잔고 수집
        env:
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
        run: |
          for i in 1 2 3; do
            python fetch_lending.py && exit 0
            echo "실패 ($i/3), 5분 뒤 재시도"
            sleep 300
          done
          exit 1

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lending.json
          git commit -m "대차잔고 업데이트" || echo "변경 없음"
          git pull --rebase
          git push
