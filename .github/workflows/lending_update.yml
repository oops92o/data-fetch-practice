name: 대차잔고 업데이트

on:
  schedule:
    # 대차 자료는 다음 영업일 13시 이후에 올라와요. 저녁에 받아서 전날 자료를 채워요.
    # GitHub 예약 실행은 늦어지거나 건너뛸 때가 있어서 예비 시각을 두 번 더 넣었어요. (시각은 UTC 기준)
    - cron: "20 11 * * 1-5"   # 한국시간 20:20
    - cron: "29 13 * * 1-5"   # 한국시간 22:29 (예비)
    - cron: "35 21 * * 1-5"   # 한국시간 다음 날 06:35 (예비)
  workflow_dispatch: {}        # Actions 탭에서 손으로 실행할 수 있게

jobs:
  lending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install requests pykrx

      - name: 대차잔고 수집
        env:
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
          PYTHONUNBUFFERED: "1"      # 진행 상황이 로그에 바로바로 찍히게
        timeout-minutes: 25          # 아무리 길어도 25분이면 멈춰요
        run: |
          for i in 1 2 3; do
            python fetch_lending.py
            code=$?
            if [ $code -eq 0 ]; then exit 0; fi
            if [ $code -eq 2 ]; then echo "인증키 문제라 재시도하지 않아요"; exit 2; fi
            echo "실패 ($i/3), 5분 뒤 재시도"
            sleep 300
          done
          exit 1

      - name: 외국인 현물·선물 수집 (코스피200 선물, 정규+야간)
        if: always()            # 대차 수집이 실패해도 이 단계는 시도해요
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            python fetch_futures.py && exit 0
            echo "실패 ($i/3), 2분 뒤 재시도"
            sleep 120
          done
          exit 1

      - name: 수급 포착 (대차 + 연기금·외국인 겹쳐 보기)
        if: always()
        run: python signals.py

      - name: 내 종목 트래킹 (watchlist.json)
        if: always()
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            python fetch_watch.py && exit 0
            echo "실패 ($i/3), 1분 뒤 재시도"
            sleep 60
          done
          exit 1

      - name: 결과 커밋
        if: always()            # 하나만 성공해도 그 결과는 저장해요
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in lending.json lending_history.json signals.json futures.json watch.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "대차잔고 업데이트" || echo "변경 없음"
          git pull --rebase
          git push
