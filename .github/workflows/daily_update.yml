name: 연기금 데이터 업데이트

on:
  schedule:
    # GitHub 예약 실행은 늦어지거나 건너뛸 때가 있어서 예비 시각을 두 번 더 넣었어요. (시각은 UTC 기준)
    - cron: "0 10 * * 1-5"    # 한국시간 19:00
    - cron: "5 13 * * 1-5"    # 한국시간 22:05 (예비)
    - cron: "10 21 * * 1-5"   # 한국시간 다음 날 06:10 (예비)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install pykrx

      - name: 데이터 수집
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          for i in 1 2 3; do
            python fetch_pension_data.py && exit 0
            echo "실패 ($i/3), 5분 뒤 재시도"
            sleep 300
          done
          exit 1

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "연기금 데이터 업데이트" || echo "변경 없음"
          git pull --rebase
          git push
