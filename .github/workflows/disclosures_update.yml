name: 공시 알리미 업데이트

on:
  schedule:
    - cron: "10 22-23,0-11 * * *"   # 한국시간 07:10~20:10, 매시 10분
  workflow_dispatch: {}              # Actions 탭에서 손으로 실행할 수 있게

jobs:
  disclosures:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          for i in 1 2 3; do
            python fetch_disclosures.py && exit 0
            echo "실패 ($i/3), 1분 뒤 재시도"
            sleep 60
          done
          exit 1

      - name: 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_disclosures.py

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in disclosures.json notified.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "공시 알리미 업데이트" || echo "변경 없음"
          git pull --rebase
          git push
